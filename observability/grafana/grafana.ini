# Grafana config. Most options come from env vars (GF_* in compose) — only
# the SMTP block lives here because we want the password substituted from an
# env var without leaking it via /api/admin/settings.

[paths]
provisioning = /etc/grafana/provisioning

[server]
# Behind a host port mapping (137000 → 3000 in compose); the root_url is
# only used to build links in alert emails.
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[analytics]
reporting_enabled = false
check_for_updates = false

[users]
allow_sign_up = false

[security]
# Admin user/password are injected via GF_SECURITY_ADMIN_USER /
# GF_SECURITY_ADMIN_PASSWORD env vars in docker-compose.yml.
disable_initial_admin_creation = false
cookie_secure = false
cookie_samesite = lax

[smtp]
# Resend SMTP relay. Credentials come from env (GF_SMTP_USER /
# GF_SMTP_PASSWORD). User is the literal string "resend"; password is the
# RESEND_API_KEY we already use for transactional email.
enabled = true
host = smtp.resend.com:465
user = ${GF_SMTP_USER}
password = ${GF_SMTP_PASSWORD}
from_address = ${GF_SMTP_FROM_ADDRESS}
from_name = ${GF_SMTP_FROM_NAME}
skip_verify = false
startTLS_policy = NoStartTLS

[unified_alerting]
enabled = true
