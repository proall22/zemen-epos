# Promtail config — discovers running docker containers via the docker socket,
# tails their stdout/stderr, and ships them to Loki. Labels are derived from
# compose metadata so you can filter by `{compose_service="api"}` in Grafana.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_name
        regex: "/eirms-epay-.*"
        action: keep
      # Promote compose service + container name + project to labels.
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: compose_service
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        target_label: compose_project
      - source_labels:
          - __meta_docker_container_name
        regex: "/(.*)"
        target_label: container
      # Drop noisy container-engine streams: cAdvisor self-logs, promtail's
      # own startup chatter. Adjust if a service was missed.
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        regex: "(promtail|cadvisor)"
        action: drop

    pipeline_stages:
      - json:
          expressions:
            level: level
            req_id: requestId
            msg: message
            stream: stream
            event_type: eventType
      - labels:
          level:
          stream:
